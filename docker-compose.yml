services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: nova_crm
    volumes:
      - nova_data:/var/lib/postgresql
      - ../nova-crm-postgresql/01-crm-database.sql:/docker-entrypoint-initdb.d/01.sql:ro
      - ../nova-crm-postgresql/02-lead-manager.sql:/docker-entrypoint-initdb.d/02.sql:ro
      - ../nova-crm-postgresql/03-customer-portal.sql:/docker-entrypoint-initdb.d/03.sql:ro
      - ../nova-crm-postgresql/04-inquiries.sql:/docker-entrypoint-initdb.d/04.sql:ro
      - ../nova-crm-postgresql/05-bookings.sql:/docker-entrypoint-initdb.d/05.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nova_crm"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: "host=db dbname=nova_crm user=postgres password=${POSTGRES_PASSWORD}"
      NOVA_API_KEY: "${NOVA_API_KEY}"
    depends_on:
      db:
        condition: service_healthy

volumes:
  nova_data:
